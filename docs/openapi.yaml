  /api/taiga/validar-proyecto:
    post:
      tags:
        - Taiga
      summary: Validar proyecto de Taiga
      description: >
        Comprueba si un proyecto de Taiga es válido y verifica la participación de los miembros del equipo y del profesor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - proyectoUrl
                - miembrosIds
                - profesorId
                - equipoId
              properties:
                proyectoUrl:
                  type: string
                  description: URL pública o identificador del proyecto en Taiga.
                  example: "https://tree.taiga.io/project/usuario-miproyecto"
                miembrosIds:
                  type: array
                  description: Lista de IDs de los miembros del equipo.
                  items:
                    type: integer
                  example: [ 1, 2, 3 ]
                profesorId:
                  type: integer
                  description: ID del profesor asociado al proyecto.
                  example: 10
                equipoId:
                  type: integer
                  description: ID del equipo en el sistema.
                  example: 5
      responses:
        "200":
          description: Validación completada exitosamente
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                example:
                  "proyectoValido": true
                  "miembrosValidos": true
        "403":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Usuario no autenticado"
        "500":
          description: Error al comunicarse con Taiga o error interno
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Error al comunicarse con la API de Taiga..."

  /api/taiga/confirmar-proyecto:
    post:
      tags:
        - Taiga
      summary: Confirmar y asignar proyecto de Taiga
      description: >
        Asigna definitivamente un proyecto validado de Taiga a un equipo específico del sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - equipoId
                - proyectoUrl
              properties:
                equipoId:
                  type: integer
                  example: 5
                proyectoUrl:
                  type: string
                  example: "https://tree.taiga.io/project/usuario-miproyecto"
      responses:
        "200":
          description: Proyecto asignado correctamente
