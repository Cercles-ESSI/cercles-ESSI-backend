                        nombre:
                          type: string
                          description: El nombre del estudiante.
                        correo:
                          type: string
                          description: El correo electrónico del estudiante.
                  sinEquipo:
                    type: array
                    description: Lista de estudiantes que no tienen equipo.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
