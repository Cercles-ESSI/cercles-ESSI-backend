  /api/taiga/equipo/{equipoId}/metrics:
    get:
      tags:
        - Taiga
      summary: Obtener métricas locales de Taiga
      description: >
        Obtiene las estadísticas de tareas, historias y los detalles del dashboard de un equipo (Solo accesible para PROFESOR).
      parameters:
        - name: equipoId
          in: path
          required: true
          description: ID del equipo del cual obtener las métricas.
          schema:
            type: integer
            example: 5
        - name: proyecto
          in: query
          required: true
          description: Nombre o identificador del proyecto.
          schema:
            type: string
            example: "mi-proyecto-taiga"
        - name: tipoFiltro
          in: query
          required: false
          description: Tipo de filtro a aplicar a las métricas (por defecto "global").
          schema:
            type: string
            default: "global"
            example: "sprint"
        - name: evaluacionId
          in: query
          required: false
          description: ID de la evaluación específica a filtrar.
          schema:
            type: integer
            example: 2
      responses:
        "200":
          description: Métricas obtenidas exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  estadisticasTareas:
                    type: object
                    description: "Objeto TareasEquipoDTO con las métricas de tareas."
                  estadisticasHistorias:
                    type: object
                    description: "Objeto HistoriasEquipoDTO con las métricas de historias."
                  detallesTaiga:
                    type: array
                    description: "Lista de objetos HistoriaDetalleDTO."
                    items:
                      type: object
        "400":
          description: Bad Request / Error al cargar estadísticas
          content:
            text/plain:
              schema:
                type: string
                example: "Error al cargar las estadísticas: [mensaje]"
        "403":
          description: Usuario no autenticado / Falta rol de profesor
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Usuario no autenticado"

  /api/taiga/equipo/{equipoId}/sincronizar:
    post:
      tags:
        - Taiga
      summary: Sincronizar Taiga local
      description: >
        Sincroniza manualmente las historias de usuario y tareas de Taiga con la base de datos local del sistema.
      parameters:
        - name: equipoId
          in: path
          required: true
          description: ID del equipo a sincronizar.
